name: Build Flatpak release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example, v0.1.0)
        required: true
        type: string

jobs:
  build-flatpak:
    name: Build x86_64 Flatpak bundle
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.trunar.Hovir.json
          bundle: Hovir-${{ inputs.tag || github.ref_name }}-x86_64.flatpak
          artifact-name: hovir-${{ inputs.tag || github.ref_name }}-x86_64
          cache-key: flatpak-builder-${{ github.sha }}

  publish-release:
    name: Attach bundle to GitHub Release
    runs-on: ubuntu-24.04
    needs: build-flatpak
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v8
        with:
          name: hovir-${{ inputs.tag || github.ref_name }}-x86_64
          path: dist

      - name: Create release and upload bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.flatpak --clobber
